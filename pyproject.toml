[project]
name = "semantic-analysis-of-movie-reviews"
version = "0.1.0"
description = "Word2Vec semantic analysis of movie reviews with an interactive Streamlit demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gensim~=4.4",
    "matplotlib~=3.11",
    "nltk~=3.10",
    "numpy~=2.4",
    "pandas~=3.0",
    "scikit-learn~=1.9",
    "streamlit~=1.59",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "ruff~=0.15",
]

# This is an application, not a distributable library, so uv does not build/install
# the project itself; src/ is imported via the pytest pythonpath below.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are verified by executing them end-to-end (jupyter nbconvert),
# not by the linter, so they are excluded here.
extend-exclude = ["*.ipynb"]
